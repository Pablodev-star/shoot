<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#38210f" />
    <!-- Inline favicon: the red life diamond, the game's oldest visual. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2338210f'/%3E%3Cpath d='M16 4 L28 16 L16 28 L4 16 Z' fill='%23c62f2a' stroke='%235a0f0e' stroke-width='2'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Shoot! — a turn-based western duel in pixel art. Reload, shield or shoot before your rival. Walk the desert, manage hunger, buy at shops, rest at inns and ride through five worlds to the final boss."
    />
    <title>SHOOT! — Western Duels</title>

    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/ui.css" />
    <link rel="stylesheet" href="./styles/menu.css" />
    <link rel="stylesheet" href="./styles/game.css" />
    <!--
      The Admin Panel. Last, so it can override the kit it borrows, and loaded
      with everything else because a stylesheet fetched at the moment a hidden
      tool opens is a stylesheet that announces the hidden tool exists.
    -->
    <link rel="stylesheet" href="./styles/admin.css" />
  </head>
  <body>
    <div id="app">
      <!-- Every scene (menu backdrop, exploration, duel) renders here. -->
      <canvas id="scene-canvas"></canvas>

      <!-- Screens are mounted here by src/core/router.js. -->
      <main id="screen-root"></main>

      <!-- Saloon-door wipe played between screens. -->
      <div id="transition"></div>

      <!-- Nailed-sign notifications. -->
      <div id="toasts"></div>

      <!--
        Achievement notices. Its own layer, above everything including the
        modal backdrop, because an unlock has to be visible wherever the player
        is standing when it lands.
      -->
      <div id="achievement-notices"></div>

      <noscript>
        <div style="padding: 40px; text-align: center; font-family: Georgia, serif">
          SHOOT! needs JavaScript enabled.
        </div>
      </noscript>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
